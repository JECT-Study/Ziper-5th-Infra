name: Verify Cloudflare access manually
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    steps:
      - name: Require successful CI for this exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" -f head_sha="$GITHUB_SHA" -f branch=main -f event=push -f status=success --jq '.workflow_runs | length')
          test "$count" -gt 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify token and read access without changing Cloudflare resources
        run: python3 scripts/verify-cloudflare-access.py
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_NAME: ${{ vars.CLOUDFLARE_ZONE_NAME }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: npm ci
      - name: Diagnose protected home origin without deploying
        run: node scripts/verify-origin.ts
        env:
          PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
          HOME_ORIGIN: ${{ vars.HOME_ORIGIN }}
          BACKUP_ENABLED: ${{ vars.BACKUP_ENABLED || 'false' }}
          BACKUP_ORIGIN: ${{ vars.BACKUP_ORIGIN }}
          HOME_ACCESS_CLIENT_ID: ${{ secrets.HOME_ACCESS_CLIENT_ID }}
          HOME_ACCESS_CLIENT_SECRET: ${{ secrets.HOME_ACCESS_CLIENT_SECRET }}
          HOME_ACCESS_CREDENTIALS_SHA256: ${{ secrets.HOME_ACCESS_CREDENTIALS_SHA256 }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: home-origin-health
          path: dist/home-origin-health.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: cloudflare-access
          path: dist/cloudflare-access.json
          if-no-files-found: ignore
